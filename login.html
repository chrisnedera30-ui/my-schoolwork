<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px;
        }
        .box {
            border: 2px solid #000000;
            display: inline-block;
            padding: 20px 40px;
        }
        .header {
            background-color: #000000;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            padding: 8px 20px;
            margin-bottom: 25px;
        }
        label {
            color: #000000;
            font-size: 18px;
            display: inline-block;
            width: 110px;
            text-align: left;
        }
        input {
            padding: 6px;
            font-size: 16px;
            margin-bottom: 15px;
            border: 1px solid #000000;
        }
        button {
            padding: 6px 15px;
            font-size: 16px;
            margin: 5px;
            border: 1px solid #000000;
        }
        .credit {
            color: #000000;
            margin-top: 20px;
            font-size: 16px;
        }
        .back {
            margin-top: 25px;
        }
        .back a {
            color: #0000EE;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">Portal Login</div>
        
        <p>
            <label>Username:</label>
            <input type="text" placeholder="Enter Email...">
        </p>
        <p>
            <label>Password:</label>
            <input type="password" placeholder="Enter Password">
        </p>
        
        <p>
            <button>Submit</button>
            <button type="reset">Reset</button>
        </p>
        
        <p class="credit">Created by: Bactol - 12-Cooper</p>
    </div>
    
    <p class="back"><a href="index.html">← Back to Home</a></p>
</body>
</html>
