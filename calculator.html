<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 28px;
            color: #1a1a2e;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin: 20px 0 8px;
            color: #666;
            font-size: 16px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 18px;
        }
        .result {
            font-size: 22px;
            font-weight: bold;
            margin-top: 8px;
            color: #1a1a2e;
        }
        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }
        button {
            flex: 1;
            padding: 14px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .compute {
            background-color: #ff8a29;
            color: white;
        }
        .reset {
            background-color: #6b7280;
            color: white;
        }
        .credit {
            margin-top: 30px;
            color: #666;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Discount Calculator</h1>

    <label>PRICE BEFORE DISCOUNT</label>
    <input type="number" id="originalPrice" placeholder="Enter amount">

    <label>DISCOUNT (%)</label>
    <input type="number" id="discountPercent" placeholder="Enter %">

    <label>PRICE AFTER DISCOUNT</label>
    <div class="result">₱ <span id="finalPrice">0.00</span></div>

    <label>SAVED AMOUNT</label>
    <div class="result">₱ <span id="savedAmount">0.00</span></div>

    <div class="buttons">
        <button class="compute" onclick="calculate()">Compute</button>
        <button class="reset" onclick="resetAll()">Reset</button>
    </div>

    <p class="credit">PROGRAMMED BY: BACTOL, 12 COOPER</p>
</div>

<script>
function calculate() {
    // Get values from inputs
    let price = parseFloat(document.getElementById('originalPrice').value);
    let discount = parseFloat(document.getElementById('discountPercent').value);

    // Check if valid numbers
    if (isNaN(price) || isNaN(discount)) {
        alert("Please enter valid numbers!");
        return;
    }

    // Formula
    let saved = price * (discount / 100);
    let final = price - saved;

    // Show results (2 decimal places)
    document.getElementById('finalPrice').textContent = final.toFixed(2);
    document.getElementById('savedAmount').textContent = saved.toFixed(2);
}

function resetAll() {
    // Clear everything
    document.getElementById('originalPrice').value = '';
    document.getElementById('discountPercent').value = '';
    document.getElementById('finalPrice').textContent = '0.00';
    document.getElementById('savedAmount').textContent = '0.00';
}
</script>

</body>
</html>
